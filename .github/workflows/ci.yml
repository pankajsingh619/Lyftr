name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12 + Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite (offline, no live provider keys)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          CACHE_ENABLED: "true"
          CACHE_TYPE: local
        run: |
          mkdir -p test-results
          pytest -v --junitxml=test-results/pytest-report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: backend/test-results/pytest-report.xml
          retention-days: 14

  frontend:
    name: Frontend (Node.js 22 + Vite Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_ENABLE_FAILURE_SIMULATION: "false"
        run: npm run build

      - name: Verify mandatory data-testid attributes in bundle
        working-directory: frontend
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const assetsDir = path.join("dist", "assets");
            const bundle = fs.readdirSync(assetsDir)
              .filter((f) => f.endsWith(".js"))
              .map((f) => fs.readFileSync(path.join(assetsDir, f), "utf8"))
              .join("\n");
            const required = [
              "chat-input",
              "send-button",
              "assistant-message",
              "meta-source",
              "meta-model",
              "meta-latency",
              "meta-input-tokens",
              "meta-output-tokens",
              "system-prompt-input",
            ];
            const missing = required.filter((id) => !bundle.includes(id));
            if (missing.length > 0) {
              console.error("Missing data-testid attributes:", missing);
              process.exit(1);
            }
            console.log("All 9 mandatory data-testid attributes verified.");
          '

      - name: Upload frontend production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14
