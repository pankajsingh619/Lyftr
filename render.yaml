services:
  - type: web
    name: lyftr-llm-chatbot-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: lyftr-sqlite-disk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "false" # Disabled in production; set "true" only for controlled testing
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TYPE
        value: local
      - key: LLM_MODEL
        value: openrouter/openrouter/free
      - key: LLM_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
